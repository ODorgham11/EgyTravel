services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: limo
      POSTGRES_PASSWORD: limo
      POSTGRES_DB: limo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://limo:limo@postgres:5432/limo
      DIRECT_DATABASE_URL: postgresql://limo:limo@postgres:5432/limo
      NODE_ENV: development
      PORT: 3000
      MOCK_MODE: "true"
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-prod
      JWT_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      TRIP_PENDING_EXPIRY_MINUTES: "60"
      TRIP_ASSIGNED_EXPIRY_MINUTES: "30"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src          # hot reload in dev
      - ./backend/prisma:/app/prisma

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000

volumes:
  postgres_data:
